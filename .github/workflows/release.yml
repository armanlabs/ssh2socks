name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            ext: .exe
          - rid: linux-x64
            ext: ""
          - rid: linux-arm64
            ext: ""
          - rid: osx-x64
            ext: ""
          - rid: osx-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish ssh2socks.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/ssh2socks-${{ matrix.rid }}

      # Copy the executable with a platform-specific name to avoid conflicts in the release
      - name: Prepare release asset
        run: |
          mkdir -p release-assets
          cp artifacts/ssh2socks-${{ matrix.rid }}/ssh2socks${{ matrix.ext }} release-assets/ssh2socks-${{ matrix.rid }}${{ matrix.ext }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ssh2socks-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
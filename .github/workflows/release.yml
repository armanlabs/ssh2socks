name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            ext: .exe
          - rid: linux-x64
            ext: ""
          - rid: linux-arm64
            ext: ""
          - rid: osx-x64
            ext: ""
          - rid: osx-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: |
          dotnet publish ssh2socks.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o publish/${{ matrix.rid }}

      - name: Prepare release folder
        run: |
          mkdir -p release/ssh2socks-${{ matrix.rid }}

          cp publish/${{ matrix.rid }}/ssh2socks${{ matrix.ext }} \
             release/ssh2socks-${{ matrix.rid }}/

          cp README.md release/ssh2socks-${{ matrix.rid }}/
          cp LICENSE release/ssh2socks-${{ matrix.rid }}/
          cp .env.example release/ssh2socks-${{ matrix.rid }}/

      - name: Create zip
        run: |
          cd release
          zip -r ssh2socks-${{ matrix.rid }}.zip ssh2socks-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh2socks-${{ matrix.rid }}
          path: release/ssh2socks-${{ matrix.rid }}.zip

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true